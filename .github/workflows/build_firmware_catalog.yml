name: Build LuxQMK Firmware Catalog

on:
  workflow_dispatch:
    inputs:
      target_scope:
        description: 'Target Keyboards Scope'
        required: true
        type: choice
        options:
          - 'tier1_all'       # GMMK 3 + GMMK 2 + Keychron V/Q Series (Incremental update)
          - 'gmmk3_only'      # GMMK 3 Series only (Incremental update)
          - 'gmmk2_only'      # GMMK 2 Series only (Incremental update)
          - 'keychron_only'   # Keychron V & Q Series only (Incremental update)
          - 'custom'          # Custom selected keyboards (Incremental update)
          - 'all_via'         # Mass compile all QMK VIA-compatible keyboards
          - 'all_keyboards'   # Mass compile all QMK default keyboards
        default: 'tier1_all'
      custom_targets:
        description: 'Custom Keyboard Targets (if scope is custom; comma/space separated, e.g. gmmk/gmmk3/p75/ansi:via)'
        required: false
        type: string
        default: ''
      shard_count:
        description: 'Matrix Shard Count for Mass Compilation (Parallel Runners)'
        required: false
        type: choice
        options:
          - '21'              # Hybrid Pool: 1x OCI (4-thread) + 20x GitHub Actions (2-thread)
          - '20'              # GitHub Only Pool: 20x Parallel ubuntu-latest
          - '16'
          - '12'
          - '8'
          - '4'
          - '1'               # Single Runner (Recommended for Hetzner On-Demand CPX / Single OCI Node)
        default: '21'
      runner_pool:
        description: 'Runner Execution Pool'
        required: true
        type: choice
        options:
          - 'hetzner_cpx62'   # On-Demand Hetzner Cloud: 16 vCPU AMD EPYC / 32GB RAM (FSN1 Falkenstein) - Maximum 16-Thread Power
          - 'hetzner_cpx52'   # On-Demand Hetzner Cloud: 12 vCPU AMD EPYC / 24GB RAM (FSN1 Falkenstein) - 12-Thread Power
          - 'hetzner_cpx42'   # On-Demand Hetzner Cloud: 8 vCPU AMD EPYC / 16GB RAM (FSN1 Falkenstein) - 8-Thread Power
          - 'hybrid'          # Hybrid: OCI Dedicated Node (1x 4-thread) + GitHub Actions (20x Parallel) - 21 Shards
          - 'github_only'     # GitHub-Hosted Runners (20x Parallel ubuntu-latest - 100% Free)
          - 'oci_only'        # Dedicated OCI Cloud Node only (1x 4-thread)
        default: 'hetzner_cpx62'
      firmware_tag:
        description: 'Firmware Version Tag (e.g. v0.3.4)'
        required: true
        default: 'v0.3.4'
      hetzner_teardown:
        description: 'Hetzner Runner Teardown Strategy'
        required: true
        type: choice
        options:
          - 'keep_alive_55m'    # Reuse server for 55m within the paid hour, then auto-delete (Recommended)
          - 'delete_immediately' # Delete server immediately after this workflow completes
        default: 'keep_alive_55m'
      deploy_cloudflare_pages:
        description: 'Deploy to Cloudflare Pages (files.luxqmk.click)?'
        required: true
        type: boolean
        default: true
      deploy_gh_pages:
        description: 'Deploy backup to GitHub Pages?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Dynamic Matrix Preparation (Single Targets or Balanced Mass Shards)
  # ---------------------------------------------------------------------------
  prepare-matrix:
    name: Prepare Build Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Calculate Target Matrix
        id: set-matrix
        run: |
          python3 util/prepare_build_matrix.py \
            --scope "${{ inputs.target_scope }}" \
            --custom-targets "${{ inputs.custom_targets }}" \
            --shards "${{ inputs.shard_count }}" \
            --runner-pool "${{ inputs.runner_pool }}" \
            --github-output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 1.5. On-Demand Hetzner Cloud Ephemeral Runner Provisioning (FSN1 Falkenstein)
  # ---------------------------------------------------------------------------
  start-hetzner-runner:
    name: Provision On-Demand Hetzner Runner (FSN1)
    needs: [prepare-matrix]
    if: startsWith(inputs.runner_pool, 'hetzner')
    runs-on: ubuntu-latest
    outputs:
      server_name: ${{ steps.spawn.outputs.server_name }}
    steps:
      - name: Install Hetzner Cloud CLI (hcloud)
        run: |
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar -xz
          sudo mv hcloud /usr/local/bin/
          hcloud version

      - name: Generate GitHub Actions Registration Token
        id: get-token
        run: |
          TOKEN_RESP=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_RUNNER_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token)
          
          RUNNER_TOKEN=$(echo "$TOKEN_RESP" | jq -r .token)
          if [ -z "$RUNNER_TOKEN" ] || [ "$RUNNER_TOKEN" = "null" ]; then
            echo "::error::Failed to generate GitHub Actions registration token. Please check GH_RUNNER_PAT secret."
            exit 1
          fi
          echo "token=$RUNNER_TOKEN" >> $GITHUB_OUTPUT

      - name: Create Cloud-Init Script & Launch Server
        id: spawn
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          EXISTING_SERVER=$(hcloud server list --selector "role=luxqmk-builder" -o json | jq -r '.[0].name // empty')
          if [ -n "$EXISTING_SERVER" ]; then
            echo ">>> Active Hetzner builder server already exists: $EXISTING_SERVER"
            echo ">>> Reusing existing runner within current paid hour window!"
            echo "server_name=$EXISTING_SERVER" >> $GITHUB_OUTPUT
            exit 0
          fi

          SERVER_NAME="luxqmk-hetzner-builder"
          SERVER_TYPE="cpx62"
          RUNNER_ARCH="x64"
          
          if [ "${{ inputs.runner_pool }}" = "hetzner_cpx52" ]; then
            SERVER_TYPE="cpx52"
            RUNNER_ARCH="x64"
          elif [ "${{ inputs.runner_pool }}" = "hetzner_cpx42" ]; then
            SERVER_TYPE="cpx42"
            RUNNER_ARCH="x64"
          fi
          
          echo "server_name=$SERVER_NAME" >> $GITHUB_OUTPUT
          
          cat << 'EOF' > user-data.sh
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive

          # Install Docker & system dependencies
          apt-get update -y
          apt-get install -y docker.io curl jq tar sudo git
          systemctl enable --now docker

          # Install hcloud CLI on the VM for self-destruct watchdog
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar -xz
          mv hcloud /usr/local/bin/

          # Start 55-minute (3300s) auto-destruct watchdog to prevent 2nd hour billing
          nohup bash -c "sleep 3300 && export HCLOUD_TOKEN='__HCLOUD_TOKEN__' && hcloud server delete __SERVER_NAME__" >/dev/null 2>&1 &

          # Create dedicated runner user and grant docker permissions
          useradd -m -s /bin/bash runner || true
          usermod -aG docker runner
          echo "runner ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

          # Download and extract GitHub Actions Runner
          RUNNER_DIR="/home/runner/actions-runner"
          mkdir -p "$RUNNER_DIR"
          cd "$RUNNER_DIR"

          RUNNER_VER="2.322.0"
          ARCH="__RUNNER_ARCH__"
          curl -fsSL -o runner.tar.gz "https://github.com/actions/runner/releases/download/v${RUNNER_VER}/actions-runner-linux-${ARCH}-${RUNNER_VER}.tar.gz"
          tar -xzf runner.tar.gz
          chown -R runner:runner /home/runner

          # Configure as persistent background service for the duration of the 55-minute session
          sudo -u runner ./config.sh \
            --url "https://github.com/__REPO__" \
            --token "__RUNNER_TOKEN__" \
            --name "__SERVER_NAME__" \
            --labels "hetzner-builder" \
            --unattended

          ./svc.sh install runner
          ./svc.sh start
          EOF

          sed -i "s|__RUNNER_ARCH__|${RUNNER_ARCH}|g" user-data.sh
          sed -i "s|__REPO__|${{ github.repository }}|g" user-data.sh
          sed -i "s|__RUNNER_TOKEN__|${{ steps.get-token.outputs.token }}|g" user-data.sh
          sed -i "s|__SERVER_NAME__|${SERVER_NAME}|g" user-data.sh
          sed -i "s|__HCLOUD_TOKEN__|${{ secrets.HETZNER_API_TOKEN }}|g" user-data.sh

          echo ">>> Launching Hetzner Cloud Server: $SERVER_NAME (Type: $SERVER_TYPE, Datacenter: fsn1 Falkenstein)..."
          hcloud server create \
            --name "$SERVER_NAME" \
            --type "$SERVER_TYPE" \
            --image "ubuntu-26.04" \
            --location "fsn1" \
            --label "role=luxqmk-builder" \
            --user-data-from-file "user-data.sh"
            
          echo ">>> Server created successfully. Waiting for runner to connect to GitHub Actions..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.GH_RUNNER_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/runners | jq -r ".runners[] | select(.name==\"$SERVER_NAME\") | .status" || echo "")
            
            if [ "$STATUS" = "online" ]; then
              echo ">>> Runner $SERVER_NAME is ONLINE and ready!"
              break
            fi
            echo ">>> Waiting for runner to register... ($i/30)"
            sleep 5
          done

  # ---------------------------------------------------------------------------
  # 2. Parallel Firmware Compilation (with Ccache & Multithreading)
  # ---------------------------------------------------------------------------
  build-firmware:
    name: Compile ${{ matrix.name }} (${{ matrix.pool }})
    needs: [prepare-matrix, start-hetzner-runner]
    if: always() && needs.prepare-matrix.result == 'success' && (needs.start-hetzner-runner.result == 'success' || needs.start-hetzner-runner.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/qmk/qmk_cli
    continue-on-error: true
    env:
      CCACHE_CONFIGPATH: /root/.cache
      CCACHE_DIR: /root/.cache/ccache

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Disable Git Safe Directory Warning
        run: git config --global --add safe.directory '*'

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Compiler & QMK Environment
        run: |
          git config --global --add safe.directory '*'
          qmk config user.qmk_home="$GITHUB_WORKSPACE" 2>/dev/null || true

          # Clean up any broken external third-party repo entries (e.g. outdated github-cli GPG keys in debian containers)
          (sudo rm -f /etc/apt/sources.list.d/github-cli.list /etc/apt/sources.list.d/*github*.list 2>/dev/null || rm -f /etc/apt/sources.list.d/github-cli.list /etc/apt/sources.list.d/*github*.list 2>/dev/null) || true

          if ! command -v qmk &>/dev/null || ! command -v arm-none-eabi-gcc &>/dev/null; then
            echo ">>> Installing Cross-Compilers and QMK CLI..."
            (command -v sudo >/dev/null && sudo apt-get update -y && sudo apt-get install -y gcc-arm-none-eabi gcc-avr avr-libc binutils-arm-none-eabi libnewlib-arm-none-eabi gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf libnewlib-riscv64-unknown-elf dfu-util dfu-programmer avrdude ccache python3-pip pipx) || (apt-get update -y && apt-get install -y gcc-arm-none-eabi gcc-avr avr-libc binutils-arm-none-eabi libnewlib-arm-none-eabi gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf libnewlib-riscv64-unknown-elf dfu-util dfu-programmer avrdude ccache python3-pip pipx) || true
            pipx install --force qmk || pip3 install --break-system-packages qmk || pip3 install qmk || true
            pipx ensurepath || true
          else
            echo ">>> Official QMK toolchain verified!"
            echo ">>> QMK version: $(qmk --version 2>/dev/null || echo 'ready')"
            echo ">>> ARM GCC: $(arm-none-eabi-gcc --version 2>/dev/null | head -n 1 || echo 'ready')"
          fi

          # Ensure RISC-V toolchain is available for RISC-V architectures (e.g. GD32VF103 / Sipeed Longan Nano)
          if ! command -v riscv64-unknown-elf-gcc &>/dev/null && ! command -v riscv-none-elf-gcc &>/dev/null; then
            echo ">>> Installing RISC-V cross-compiler and libraries..."
            (command -v sudo >/dev/null && sudo apt-get update -y && sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf libnewlib-riscv64-unknown-elf) || (apt-get update -y && apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf libnewlib-riscv64-unknown-elf) || true
          fi

          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Restore Ccache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /root/.cache/ccache
          key: ccache-${{ matrix.mode }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.mode }}-${{ matrix.name }}-
            ccache-${{ matrix.mode }}-

      # Tier 1 Single Board Compilation
      - name: Compile Single Board Target
        if: matrix.mode == 'single'
        run: |
          mkdir -p artifacts
          echo "=========================================================="
          echo "Compiling Target: ${{ matrix.kb }} (${{ matrix.km }})"
          echo "=========================================================="
          qmk compile -kb ${{ matrix.kb }} -km ${{ matrix.km }} -e USER_NAME=luxqmk -e USE_CCACHE=yes || qmk compile -kb ${{ matrix.kb }} -km ${{ matrix.km }} -e USE_CCACHE=yes
          
          find .build -type f \( -name "*.bin" -o -name "*.hex" -o -name "*.uf2" \) -exec cp {} artifacts/ \; 2>/dev/null || true
          find . -maxdepth 1 -type f \( -name "*.bin" -o -name "*.hex" -o -name "*.uf2" \) -exec cp {} artifacts/ \; 2>/dev/null || true
          
          echo "Generated $(ls -1 artifacts/ 2>/dev/null | wc -l) binary files."

      # Mass Compilation Shard (Parallel Multithreaded Build)
      - name: Compile Sharded Group Targets
        if: matrix.mode == 'shard'
        run: |
          mkdir -p artifacts
          echo "=========================================================="
          echo "Preparing Target List for ${{ matrix.name }} (Shard ${{ matrix.shard_id }}/${{ matrix.total_shards }})"
          echo "=========================================================="
          
          python3 util/prepare_build_matrix.py \
            --scope "${{ inputs.target_scope }}" \
            --custom-targets "${{ inputs.custom_targets }}" \
            --shards "${{ matrix.total_shards }}" \
            --runner-pool "${{ inputs.runner_pool }}" \
            --get-shard-targets \
            --shard-id "${{ matrix.shard_id }}" \
            --output-targets-file shard_targets.txt
            
          target_count=$(wc -w < shard_targets.txt 2>/dev/null || echo "0")
          parallel_threads=2
          if [ "${{ inputs.runner_pool }}" = "hetzner_cpx62" ]; then
            parallel_threads=16
          elif [ "${{ inputs.runner_pool }}" = "hetzner_cpx52" ]; then
            parallel_threads=12
          elif [ "${{ inputs.runner_pool }}" = "hetzner_cpx42" ]; then
            parallel_threads=8
          elif [ "${{ matrix.pool }}" = "hetzner" ]; then
            parallel_threads=16
          elif [ "${{ matrix.pool }}" = "oci" ]; then
            parallel_threads=4
          fi
          echo "=========================================================="
          echo "Starting Mass Compilation for ${{ matrix.name }} (${{ matrix.pool }}): $target_count keyboards with $parallel_threads compiler threads"
          echo "=========================================================="
          
          if [ "$target_count" -gt 0 ]; then
            python3 util/build_shard.py \
              --targets-file shard_targets.txt \
              --parallel "$parallel_threads" \
              --artifacts-dir artifacts \
              --build-dir .build || true
          else
            echo "No targets found for shard ${{ matrix.name }}."
          fi
          
          echo "Compiled $(ls -1 artifacts/ 2>/dev/null | wc -l) binaries in ${{ matrix.name }} shard."

      - name: Dump Ccache Statistics
        run: ccache -s || true

      - name: Save Ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /root/.cache/ccache
          key: ccache-${{ matrix.mode }}-${{ matrix.name }}-${{ github.sha }}

      - name: Extract Build Diagnostics & Failure Logs
        if: always()
        run: |
          mkdir -p diagnostics
          python3 util/process_build_report.py \
            --mode shard \
            --build-dir .build \
            --artifacts-dir artifacts \
            --output-dir diagnostics \
            --shard-name "${{ matrix.name }}"

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: ignore

      - name: Upload Shard Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.name }}
          path: diagnostics/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2.5. Cleanup On-Demand Hetzner Runner (Always Executed)
  # ---------------------------------------------------------------------------
  stop-hetzner-runner:
    name: Teardown On-Demand Hetzner Runner
    needs: [start-hetzner-runner, build-firmware]
    if: always() && needs.start-hetzner-runner.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Install Hetzner Cloud CLI (hcloud)
        run: |
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar -xz
          sudo mv hcloud /usr/local/bin/

      - name: Process Runner Teardown
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          SERVER_NAME="${{ needs.start-hetzner-runner.outputs.server_name }}"
          if [ -z "$SERVER_NAME" ]; then
            SERVER_NAME="luxqmk-hetzner-builder"
          fi

          if [ "${{ inputs.hetzner_teardown }}" = "delete_immediately" ]; then
            echo ">>> Deleting Hetzner server immediately: $SERVER_NAME..."
            hcloud server delete "$SERVER_NAME" || true
            echo ">>> Server $SERVER_NAME deleted successfully."
          else
            echo ">>> Server $SERVER_NAME remains active for subsequent builds during the current 1-hour billing window."
            echo ">>> The internal 55-minute watchdog on the VM will automatically delete it before the next hour begins."
          fi

  # ---------------------------------------------------------------------------
  # 3. Package Catalog, Generate Portal Manifest & Deploy to CDN
  # ---------------------------------------------------------------------------
  package-catalog:
    name: Generate Catalog & Deploy Distribution
    needs: [build-firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: all_binaries/
          merge-multiple: true

      - name: Download All Diagnostics
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: diag-*
          path: all_diagnostics/
          merge-multiple: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Build Catalog & Portal Distribution
        run: |
          TAG="${{ github.event.inputs.firmware_tag }}"
          
          # 1. Structure directories for files.luxqmk.click/firmware/
          mkdir -p dist/firmware/${TAG}
          mkdir -p dist/firmware/latest
          
          # 2. Incremental Sync: If building selected/single keyboards, fetch existing binaries from CDN first
          if [ "${{ inputs.target_scope }}" != "all_via" ] && [ "${{ inputs.target_scope }}" != "all_keyboards" ]; then
            echo ">>> Incremental / selective build detected (scope: ${{ inputs.target_scope }})."
            echo ">>> Fetching existing catalog and binaries from CDN (files.luxqmk.click)..."
            python3 util/sync_existing_catalog.py --output-dir dist/firmware/${TAG} || true
            cp -r dist/firmware/${TAG}/* dist/firmware/latest/ 2>/dev/null || true
          fi
          
          # 3. Overlay newly compiled binaries on top (overwriting modified keyboards)
          find all_binaries -type f \( -name "*.bin" -o -name "*.hex" -o -name "*.uf2" -o -name "*.meta.json" \) -exec cp -f {} dist/firmware/${TAG}/ \; 2>/dev/null || true
          cp -rf dist/firmware/${TAG}/* dist/firmware/latest/ 2>/dev/null || true
          
          TOTAL_BINARIES=$(ls -1 dist/firmware/${TAG}/ 2>/dev/null | wc -l)
          echo "Total catalog binaries ready: $TOTAL_BINARIES"

          # 4. Generate catalog.json inside dist/firmware/
          python3 util/generate_catalog.py \
            --artifacts-dir dist/firmware/${TAG} \
            --output-dir dist/firmware \
            --tag ${TAG} \
            --repo ${{ github.repository }} \
            --base-url "https://files.luxqmk.click/firmware/${TAG}"

          # 3. Create root alias copies and redirect helpers
          cp dist/firmware/catalog.json dist/catalog.json
          cp dist/firmware/index.html dist/index.html
          cp dist/firmware/404.html dist/404.html 2>/dev/null || true
          cp dist/firmware/_headers dist/_headers 2>/dev/null || true
          cp dist/firmware/_redirects dist/_redirects 2>/dev/null || true

          echo "Catalog distribution prepared successfully:"
          ls -lh dist/
          ls -lh dist/firmware/ | head -n 30

      - name: Generate Job Summary Markdown
        run: |
          TAG="${{ github.event.inputs.firmware_tag }}"
          TOTAL=$(jq -r '.total_keyboards // "N/A"' dist/firmware/catalog.json 2>/dev/null || echo "N/A")
          
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 LuxQMK Firmware Catalog Build Summary
          
          | Metric | Value |
          | :--- | :--- |
          | **Scope** | \`${{ inputs.target_scope }}\` |
          | **Release Tag** | \`${{ inputs.firmware_tag }}\` |
          | **Total Indexed Keyboards** | **${TOTAL}** |
          | **Primary CDN Endpoint** | [files.luxqmk.click/firmware/catalog.json](https://files.luxqmk.click/firmware/catalog.json) |
          | **Latest Tag Endpoint** | [files.luxqmk.click/firmware/${{ inputs.firmware_tag }}/](https://files.luxqmk.click/firmware/${{ inputs.firmware_tag }}/) |
          | **Studio Update Feed** | [files.luxqmk.click/studio/version.json](https://files.luxqmk.click/studio/version.json) |
          | **Official Web Portal** | [luxqmk.click](https://luxqmk.click/) |
          EOF

      - name: Process & Aggregate Compilation Diagnostics
        run: |
          python3 util/process_build_report.py \
            --mode aggregate \
            --diagnostics-root all_diagnostics \
            --output-dir dist/diagnostics \
            --github-summary "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Consolidated Diagnostics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luxqmk-build-diagnostics-${{ github.event.inputs.firmware_tag }}
          path: dist/diagnostics/

      - name: Upload Complete Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luxqmk-firmware-portal-${{ github.event.inputs.firmware_tag }}
          path: dist/

      # -----------------------------------------------------------------------
      # Cloudflare Pages Direct Deployment (files.luxqmk.click -> luxqmk-files)
      # -----------------------------------------------------------------------
      - name: Deploy to Cloudflare Pages (luxqmk-files)
        if: ${{ github.event.inputs.deploy_cloudflare_pages == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create luxqmk-files --production-branch=main || true
          npx wrangler pages deploy dist --project-name=luxqmk-files --branch=main --commit-dirty=true

      # -----------------------------------------------------------------------
      # GitHub Pages Deployment (Optional Fallback)
      # -----------------------------------------------------------------------
      - name: Deploy to GitHub Pages (Fallback)
        if: ${{ github.event.inputs.deploy_gh_pages == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: files.luxqmk.click
