name: Build LuxQMK Firmware

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as official GitHub Release?'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag Version (e.g. v0.3.1)'
        required: false
        default: 'v0.3.1'

permissions:
  contents: write

jobs:
  build-luxqmk-core:
    name: Build Core Keyboards
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # GMMK 3 Series (100%, 75%, 65% ANSI)
          - kb: gmmk/gmmk3/p100/ansi
            km: via
            output: gmmk_gmmk3_p100_ansi_via.bin
            name: gmmk3-100-ansi
          - kb: gmmk/gmmk3/p75/ansi
            km: via
            output: gmmk_gmmk3_p75_ansi_via.bin
            name: gmmk3-75-ansi
          - kb: gmmk/gmmk3/p65/ansi
            km: via
            output: gmmk_gmmk3_p65_ansi_via.bin
            name: gmmk3-65-ansi

          # GMMK 2 Series (96%, 65% ANSI)
          - kb: gmmk/gmmk2/p96/ansi
            km: via
            output: gmmk_gmmk2_p96_ansi_via.bin
            name: gmmk2-96-ansi
          - kb: gmmk/gmmk2/p65/ansi
            km: via
            output: gmmk_gmmk2_p65_ansi_via.bin
            name: gmmk2-65-ansi

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile LuxQMK Firmware
        run: |
          qmk compile -kb ${{ matrix.kb }} -km ${{ matrix.km }} -e USER_NAME=luxqmk || qmk compile -kb ${{ matrix.kb }} -km ${{ matrix.km }}

      - name: Collect Binary
        run: |
          mkdir -p artifacts
          find .build -type f \( -name "*.bin" -o -name "*.hex" -o -name "*.uf2" \) -exec cp {} artifacts/ \;

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: warn

  package-artifacts:
    name: Package All Firmware Binaries
    needs: [build-luxqmk-core]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_binaries/
          merge-multiple: true

      - name: Flatten Downloaded Binaries
        run: |
          mkdir -p release_files
          find all_binaries -type f \( -name "*.bin" -o -name "*.hex" -o -name "*.uf2" \) -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Upload Combined Firmware Package
        uses: actions/upload-artifact@v4
        with:
          name: luxqmk-firmware-binaries
          path: release_files/*

      - name: Publish GitHub Release (Only if explicitly enabled)
        uses: softprops/action-gh-release@v2
        if: ${{ github.event.inputs.publish_release == 'true' }}
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "LuxQMK Firmware ${{ github.event.inputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_files/*


