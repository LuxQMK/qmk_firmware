name: Build LuxQMK Firmware

on:
  workflow_dispatch:
    inputs:
      target_scope:
        description: 'Target Keyboards to Build'
        required: true
        type: choice
        options:
          - 'tier1_all'       # GMMK 3 (100/75/65 ANSI & ISO) + GMMK 2 (96/65 ANSI & ISO)
          - 'gmmk3_only'      # GMMK 3 Series only
          - 'gmmk2_only'      # GMMK 2 Series only
          - 'all_via'         # Mass compile all QMK VIA-compatible keyboards
        default: 'tier1_all'
      firmware_tag:
        description: 'Firmware Version Tag (e.g. v0.3.1)'
        required: true
        default: 'v0.3.1'
      deploy_cloudflare_pages:
        description: 'Deploy to Cloudflare Pages (files.luxqmk.click)?'
        required: true
        type: boolean
        default: true
      deploy_gh_pages:
        description: 'Deploy backup to GitHub Pages?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Compilation Job
  # ---------------------------------------------------------------------------
  build-firmware:
    name: Compile Firmware Targets
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # GMMK 3 Series (ANSI)
          - kb: gmmk/gmmk3/p100/ansi
            km: via
            group: gmmk3
            name: gmmk3-100-ansi
          - kb: gmmk/gmmk3/p75/ansi
            km: via
            group: gmmk3
            name: gmmk3-75-ansi
          - kb: gmmk/gmmk3/p65/ansi
            km: via
            group: gmmk3
            name: gmmk3-65-ansi

          # GMMK 3 Series (ISO)
          - kb: gmmk/gmmk3/p100/iso
            km: via
            group: gmmk3
            name: gmmk3-100-iso
          - kb: gmmk/gmmk3/p75/iso
            km: via
            group: gmmk3
            name: gmmk3-75-iso
          - kb: gmmk/gmmk3/p65/iso
            km: via
            group: gmmk3
            name: gmmk3-65-iso

          # GMMK 2 Series (ANSI & ISO)
          - kb: gmmk/gmmk2/p96/ansi
            km: via
            group: gmmk2
            name: gmmk2-96-ansi
          - kb: gmmk/gmmk2/p96/iso
            km: via
            group: gmmk2
            name: gmmk2-96-iso
          - kb: gmmk/gmmk2/p65/ansi
            km: via
            group: gmmk2
            name: gmmk2-65-ansi
          - kb: gmmk/gmmk2/p65/iso
            km: via
            group: gmmk2
            name: gmmk2-65-iso

    steps:
      - name: Checkout Repository
        if: ${{ inputs.target_scope == 'tier1_all' || inputs.target_scope == 'all_via' || (inputs.target_scope == 'gmmk3_only' && matrix.group == 'gmmk3') || (inputs.target_scope == 'gmmk2_only' && matrix.group == 'gmmk2') }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile LuxQMK Firmware
        if: ${{ inputs.target_scope == 'tier1_all' || inputs.target_scope == 'all_via' || (inputs.target_scope == 'gmmk3_only' && matrix.group == 'gmmk3') || (inputs.target_scope == 'gmmk2_only' && matrix.group == 'gmmk2') }}
        run: |
          qmk compile -kb ${{ matrix.kb }} -km ${{ matrix.km }} -e USER_NAME=luxqmk || qmk compile -kb ${{ matrix.kb }} -km ${{ matrix.km }}

      - name: Collect Binary
        if: ${{ inputs.target_scope == 'tier1_all' || inputs.target_scope == 'all_via' || (inputs.target_scope == 'gmmk3_only' && matrix.group == 'gmmk3') || (inputs.target_scope == 'gmmk2_only' && matrix.group == 'gmmk2') }}
        run: |
          mkdir -p artifacts
          find .build -type f \( -name "*.bin" -o -name "*.hex" -o -name "*.uf2" \) -exec cp {} artifacts/ \;

      - name: Upload Binary Artifact
        if: ${{ inputs.target_scope == 'tier1_all' || inputs.target_scope == 'all_via' || (inputs.target_scope == 'gmmk3_only' && matrix.group == 'gmmk3') || (inputs.target_scope == 'gmmk2_only' && matrix.group == 'gmmk2') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Package Catalog, Generate Portal & Distribute
  # ---------------------------------------------------------------------------
  package-catalog:
    name: Generate Catalog & Deploy to Cloudflare Pages
    needs: [build-firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          path: all_binaries/
          merge-multiple: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Catalog & Portal Distribution
        run: |
          TAG="${{ github.event.inputs.firmware_tag }}"
          
          # 1. Structure files for files.luxqmk.click/firmware/
          mkdir -p dist/firmware/${TAG}
          mkdir -p dist/firmware/latest
          
          find all_binaries -type f \( -name "*.bin" -o -name "*.hex" -o -name "*.uf2" \) -exec cp {} dist/firmware/${TAG}/ \;
          cp -r dist/firmware/${TAG}/* dist/firmware/latest/
          
          # 2. Generate catalog.json inside dist/firmware/
          python3 util/generate_catalog.py \
            --artifacts-dir dist/firmware/${TAG} \
            --output-dir dist/firmware \
            --tag ${TAG} \
            --repo ${{ github.repository }} \
            --base-url "https://files.luxqmk.click/firmware/${TAG}"

          # 3. Create root alias copies and placeholder root index
          cp dist/firmware/catalog.json dist/catalog.json
          cp dist/firmware/index.html dist/index.html

          ls -la dist/
          ls -la dist/firmware/

      - name: Upload Complete Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luxqmk-firmware-portal-${{ github.event.inputs.firmware_tag }}
          path: dist/

      # -----------------------------------------------------------------------
      # Cloudflare Pages Direct Deployment (files.luxqmk.click -> luxqmk-files)
      # -----------------------------------------------------------------------
      - name: Deploy to Cloudflare Pages (luxqmk-files)
        if: ${{ github.event.inputs.deploy_cloudflare_pages == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create luxqmk-files --production-branch=main || true
          npx wrangler pages deploy dist --project-name=luxqmk-files --branch=main --commit-dirty=true

      # -----------------------------------------------------------------------
      # GitHub Pages Deployment (Optional Fallback)
      # -----------------------------------------------------------------------
      - name: Deploy to GitHub Pages (Fallback)
        if: ${{ github.event.inputs.deploy_gh_pages == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: files.luxqmk.click
